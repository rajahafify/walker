<script type="module">
import * as THREE from 'three';

/* ============================================================
   WALKER: BAGFALL
   A third-person walking sim where your weapons are items in
   a backpack — every item fights for you, and every item makes
   it harder to stay upright. Horde enemies, roguelike upgrades.
   All UI is canvas-drawn.
   ============================================================ */

// ---------- utils ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
const dist2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < 4; i++) { s += amp * vnoise(x * f, y * f); norm += amp; f *= 2; amp *= 0.5; }
  return s / norm;
}
function angleLerp(a, b, t) {
  const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}

// ---------- gait (humanoid-plausible, real units) ----------
const GAIT = { cadence: 1.9, hipSwing: 0.52, kneePeak: 1.02, ankleSwing: 0.28, armSwing: 0.42, bob: 0.035, lean: 0.09 };

// ---------- renderer ----------
const glCanvas = document.getElementById('gl');
const uiCanvas = document.getElementById('ui');
const uctx = uiCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setClearColor(0x1d2733);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1d2733, 0.016);

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);

// sky dome
{
  const g = new THREE.SphereGeometry(320, 16, 10);
  const pos = g.attributes.position, cols = new Float32Array(pos.count * 3);
  const top = new THREE.Color(0x0b1422), hor = new THREE.Color(0x3a4a58), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = clamp((pos.getY(i) / 320 + 0.1) / 0.9, 0, 1);
    c.copy(hor).lerp(top, Math.pow(t, 0.65));
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -1;
  scene.add(sky);
  window.__sky = sky;
}

// lights
scene.add(new THREE.HemisphereLight(0x9db8d8, 0x2c2a20, 0.9));
const sun = new THREE.DirectionalLight(0xffd7a8, 2.0);
sun.position.set(30, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0007;
scene.add(sun, sun.target);

// ---------- terrain ----------
function WALK(x, z) {
  const base = 3.6 * (fbm(x * 0.011 + 11.3, z * 0.011 - 4.7) - 0.5);
  const roll = 0.9 * Math.sin(x * 0.013) * Math.cos(z * 0.017);
  const fine = 0.35 * (vnoise(x * 0.06, z * 0.06) - 0.5);
  return base + roll + fine;
}

const CHUNK = 45, SEG = 9, VIEW = 2;
const chunks = new Map();
const rockGeo = new THREE.IcosahedronGeometry(1, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x4a4a42, roughness: 1, flatShading: true });
const trunkGeo = new THREE.CylinderGeometry(0.07, 0.11, 1.6, 5);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2e2721, roughness: 1 });
const crownGeo = new THREE.IcosahedronGeometry(0.85, 0);
const crownMat = new THREE.MeshStandardMaterial({ color: 0x2c4430, roughness: 1, flatShading: true });

function buildChunk(ci, cj) {
  const geo = new THREE.PlaneGeometry(CHUNK, CHUNK, SEG - 1, SEG - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const ox = ci * CHUNK + CHUNK / 2, oz = cj * CHUNK + CHUNK / 2;
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k) + ox, z = pos.getZ(k) + oz;
    pos.setX(k, x); pos.setZ(k, z); pos.setY(k, WALK(x, z));
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal;
  const colors = new Float32Array(pos.count * 3);
  const cLow = new THREE.Color(0x232f28), cMid = new THREE.Color(0x4d5439), cRock = new THREE.Color(0x5c574c), c = new THREE.Color();
  for (let k = 0; k < pos.count; k++) {
    const t = clamp((pos.getY(k) + 2.6) / 5.2, 0, 1);
    c.copy(cLow).lerp(cMid, t);
    c.lerp(cRock, clamp((1 - clamp(nrm.getY(k), 0, 1) - 0.15) * 2.4, 0, 0.8));
    colors[k * 3] = c.r; colors[k * 3 + 1] = c.g; colors[k * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.97 }));
  mesh.receiveShadow = true;
  scene.add(mesh);

  const rnd = mulberry32((Math.imul(ci, 73856093) ^ Math.imul(cj, 19349663)) | 0);
  const props = new THREE.Group();
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();

  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, 4);
  rocks.castShadow = true;
  for (let i = 0; i < 4; i++) {
    const x = ox + (rnd() - 0.5) * CHUNK, z = oz + (rnd() - 0.5) * CHUNK, s = 0.25 + rnd() * 0.7;
    p.set(x, WALK(x, z) - s * 0.2, z);
    q.setFromEuler(new THREE.Euler(rnd() * 3, rnd() * 6, rnd() * 3));
    sc.set(s, s * 0.7, s);
    rocks.setMatrixAt(i, m4.compose(p, q, sc));
  }
  rocks.instanceMatrix.needsUpdate = true;
  props.add(rocks);

  const trees = new THREE.InstancedMesh(trunkGeo, trunkMat, 3);
  const crowns = new THREE.InstancedMesh(crownGeo, crownMat, 3);
  trees.castShadow = true;
  for (let i = 0; i < 3; i++) {
    const x = ox + (rnd() - 0.5) * CHUNK, z = oz + (rnd() - 0.5) * CHUNK, gy = WALK(x, z), s = 0.7 + rnd() * 0.6;
    p.set(x, gy + 0.8 * s, z); q.identity(); sc.set(s, s, s);
    trees.setMatrixAt(i, m4.compose(p, q, sc));
    p.set(x, gy + 1.8 * s, z); sc.set(s, s * 1.1, s);
    crowns.setMatrixAt(i, m4.compose(p, q, sc));
  }
  trees.instanceMatrix.needsUpdate = true;
  crowns.instanceMatrix.needsUpdate = true;
  props.add(trees, crowns);
  scene.add(props);
  chunks.set(ci + ',' + cj, { mesh, props });
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let lastCI = 1e9, lastCJ = 1e9;
function updateChunks(px, pz) {
  const ci = Math.floor(px / CHUNK), cj = Math.floor(pz / CHUNK);
  if (ci === lastCI && cj === lastCJ) return;
  lastCI = ci; lastCJ = cj;
  const wanted = new Set();
  for (let i = ci - VIEW; i <= ci + VIEW; i++)
    for (let j = cj - VIEW; j <= cj + VIEW; j++) {
      const k = i + ',' + j;
      wanted.add(k);
      if (!chunks.has(k)) buildChunk(i, j);
    }
  for (const [k, c] of [...chunks]) {
    if (!wanted.has(k)) {
      scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose();
      scene.remove(c.props);
      chunks.delete(k);
    }
  }
}

// ---------- walker rig ----------
function makeWalker() {
  const shell = new THREE.MeshStandardMaterial({ color: 0xd4d6cf, roughness: 0.45, metalness: 0.25 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.75, metalness: 0.3 });
  const glow = new THREE.MeshStandardMaterial({ color: 0xffa04d, emissive: 0xff6a00, emissiveIntensity: 1.6, roughness: 0.4 });
  const J = {};
  const root = new THREE.Group();

  const hips = new THREE.Group(); hips.position.y = 1.02; root.add(hips); J.hips = hips;
  hips.add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.18, 0.24), dark));

  const torso = new THREE.Group(); torso.position.y = 0.09; hips.add(torso); J.torso = torso;
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.44, 0.26), shell);
  chest.position.y = 0.24; torso.add(chest);
  const accent = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.015), glow);
  accent.position.set(0, 0.34, 0.135); torso.add(accent);

  // backpack: the bag is a visible rack, and cargo boxes stack on it
  const rack = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.5, 0.14), dark);
  rack.position.set(0, 0.22, -0.2); torso.add(rack);
  const cargoBoxes = [];
  for (let i = 0; i < 7; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.26 - (i % 3) * 0.05, 0.08, 0.1), glow);
    b.position.set((i % 2 ? 0.07 : -0.05), 0.06 + Math.floor(i / 2) * 0.1, -0.26);
    b.visible = false;
    torso.add(b);
    cargoBoxes.push(b);
  }

  const neck = new THREE.Group(); neck.position.y = 0.5; torso.add(neck); J.neck = neck;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.22), shell);
  head.position.y = 0.12; neck.add(head);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.045, 0.02), glow);
  visor.position.set(0, 0.13, 0.115); neck.add(visor);

  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(0.11 * s, -0.05, 0); hips.add(hip);
    const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.46, 0.15), shell);
    thigh.position.y = -0.23; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.46; hip.add(knee);
    const shin = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.44, 0.12), dark);
    shin.position.y = -0.22; knee.add(shin);
    const ankle = new THREE.Group(); ankle.position.y = -0.44; knee.add(ankle);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.07, 0.26), shell);
    foot.position.set(0, -0.035, 0.06); ankle.add(foot);
    const nm = s < 0 ? 'L' : 'R';
    J['hip' + nm] = hip; J['knee' + nm] = knee; J['ankle' + nm] = ankle;
  }
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(0.255 * s, 0.4, 0); torso.add(sh);
    const up = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.34, 0.1), shell);
    up.position.y = -0.17; sh.add(up);
    const el = new THREE.Group(); el.position.y = -0.34; sh.add(el);
    const lo = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.3, 0.09), dark);
    lo.position.y = -0.15; el.add(lo);
    const nm = s < 0 ? 'L' : 'R';
    J['sh' + nm] = sh; J['el' + nm] = el;
  }
  root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  root.userData = { J, cargoBoxes };
  return root;
}
const walker = makeWalker();
scene.add(walker);
const J = walker.userData.J;

// ---------- items ----------
// w = weight. Weight is the difficulty dial: slower, and faster
// stability drain while moving. Each item also fights for you.
const ITEM_DEFS = {
  wrench:   { name: 'WRENCH',         w: 2, kind: 'melee',  cd: 0.55, dmg: 10, color: '#ffd9a0', desc: 'Swings at everything nearby.' },
  sling:    { name: 'SLINGSHOT',      w: 1, kind: 'shot',   cd: 0.50, dmg: 7,  color: '#ffe08a', desc: 'Fires at the nearest enemy.', speed: 26 },
  knife:    { name: 'THROWING KNIFE', w: 1, kind: 'shot',   cd: 0.34, dmg: 6,  color: '#f4f4f4', desc: 'Fast, pierces twice.', speed: 34, pierce: 2 },
  crossbow: { name: 'CROSSBOW',       w: 3, kind: 'shot',   cd: 1.05, dmg: 22, color: '#ffb04a', desc: 'A heavy bolt from a heavy gun.', speed: 30, pierce: 1 },
  lantern:  { name: 'LANTERN',        w: 1, kind: 'aura',   cd: 0.35, dmg: 4,  color: '#ffd36a', desc: 'Burns whatever comes close.', radius: 4.6 },
  spikes:   { name: 'SPIKE ORB',      w: 2, kind: 'orbit',  cd: 0.16, dmg: 8,  color: '#e6e6e6', desc: 'A spike circles you, grinding enemies.' },
  battery:  { name: 'BATTERY',        w: 2, kind: 'chain',  cd: 1.10, dmg: 9,  color: '#7fd0ff', desc: 'Zaps a chain of enemies.', chains: 3, range: 11 },
  flask:    { name: 'FIRE FLASK',     w: 2, kind: 'fire',   cd: 1.40, dmg: 6,  color: '#ff8a3a', desc: 'Leaves burning ground behind.' },
  magnet:   { name: 'MAGNET',         w: 1, kind: 'passive', color: '#7fe0c0', desc: 'Pulls loot from much farther.' },
  plate:    { name: 'HEAVY PLATE',    w: 3, kind: 'passive', color: '#c8cdd6', desc: '+20 max HP. It is a plate of metal.' },
  feather:  { name: 'FEATHER',        w: 0, kind: 'passive', color: '#dfe8ff', desc: 'Bag weighs 20% less. Weird, but it works.' },
  medkit:   { name: 'MEDKIT',         w: 1, kind: 'heal',    color: '#ff8a8a', desc: 'Restores 35 hull. Used up on pickup.' },
};
const POOL = Object.keys(ITEM_DEFS);

// ---------- player ----------
const player = {
  x: 0, z: 0, y: 0, yaw: 0, speed: 0, phase: 0, prevSin: 0,
  hp: 100, maxHp: 100, stability: 1, falling: 0, hurtCd: 0,
  xp: 0, xpNext: 8, level: 1, kills: 0, t: 0, grounded: true,
};
const items = [];
let load = 0, featherBonus = 0;

function recomputeLoad() {
  let w = 0;
  for (const it of items) w += ITEM_DEFS[it.id].w;
  load = Math.max(0, w * (1 - featherBonus));
}
function speedFactor() { return clamp(1 - load * 0.045, 0.4, 1); }

function addItem(id) {
  if (id === 'medkit') { player.hp = Math.min(player.maxHp, player.hp + 35); return; }
  if (id === 'plate') { player.maxHp += 20; player.hp += 20; return; }
  if (id === 'feather') { featherBonus = Math.min(0.6, featherBonus + 0.2); recomputeLoad(); return; }
  const existing = items.find((i) => i.id === id);
  if (existing) existing.level++;
  else items.push({ id, level: 1, timer: rand(0.3), angle: rand(TAU) });
  recomputeLoad();
}
function dropHeaviest() {
  if (!items.length) return false;
  let best = 0;
  for (let i = 1; i < items.length; i++) if (ITEM_DEFS[items[i].id].w > ITEM_DEFS[items[best].id].w) best = i;
  const [gone] = items.splice(best, 1);
  recomputeLoad();
  floatMsg('DROPPED ' + ITEM_DEFS[gone.id].name, '#ffb04a');
  return true;
}

// ---------- enemies ----------
const enemies = [];
const ENEMY_DEFS = {
  crawler: { r: 0.42, hp: 10,  spd: 2.0, dmg: 7,  color: 0xe0574a },
  swarm:   { r: 0.3,  hp: 5,   spd: 3.0, dmg: 4,  color: 0xff8a5a },
  brute:   { r: 0.8,  hp: 42,  spd: 1.35, dmg: 14, color: 0xa04a7a },
};
const enemyGeo = {
  crawler: new THREE.CapsuleGeometry(0.3, 0.5, 3, 8),
  swarm: new THREE.SphereGeometry(0.28, 8, 6),
  brute: new THREE.IcosahedronGeometry(0.8, 0),
};
const enemyMats = {
  crawler: new THREE.MeshStandardMaterial({ color: 0xe0574a, roughness: 0.6, emissive: 0x5a1410, emissiveIntensity: 0.6 }),
  swarm: new THREE.MeshStandardMaterial({ color: 0xff8a5a, roughness: 0.5, emissive: 0x6a2210, emissiveIntensity: 0.7 }),
  brute: new THREE.MeshStandardMaterial({ color: 0xa04a7a, roughness: 0.7, emissive: 0x3a0f28, emissiveIntensity: 0.5, flatShading: true }),
};
const eyeGeo = new THREE.SphereGeometry(0.07, 6, 5);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffe14a });

let spawnTimer = 1.0;
function spawnEnemy() {
  const t = player.t;
  const a = rand(TAU), R = 34 + rand(14);
  const x = player.x + Math.sin(a) * R, z = player.z + Math.cos(a) * R;
  let type = 'crawler';
  const roll = Math.random();
  if (t > 30 && roll > 0.86) type = 'brute';
  else if (t > 12 && roll > 0.58) type = 'swarm';
  const d = ENEMY_DEFS[type];
  const scale = 1 + t * 0.03;
  const g = new THREE.Group();
  const body = new THREE.Mesh(enemyGeo[type], enemyMats[type]);
  g.add(body);
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(0, 0.1, d.r * 0.8);
  g.add(eye);
  g.position.set(x, WALK(x, z), z);
  scene.add(g);
  enemies.push({
    g, body, type, x, z, r: d.r, hp: d.hp * scale, maxHp: d.hp * scale,
    spd: d.spd * (1 + t * 0.005), dmg: d.dmg, flash: 0, wob: rand(TAU), dead: false,
  });
}

function hitEnemy(e, dmg, color) {
  e.hp -= dmg;
  e.flash = 0.08;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    player.kills++;
    scene.remove(e.g);
    burst(e.x, e.z, e.type === 'brute' ? 12 : 6);
    gems.push({ x: e.x, z: e.z, v: e.type === 'brute' ? 3 : 1, life: 30 });
  } else {
    floatText3(e.x, e.z, Math.round(dmg), color);
  }
}

// ---------- damage / death ----------
function hurt(amount, fromEnemy = true) {
  player.hp -= amount;
  player.hurtCd = 0.5;
  if (fromEnemy) shake = Math.max(shake, 4);
  if (player.hp <= 0) {
    player.hp = 0;
    state = 'dead';
    best = Math.max(best, Math.floor(player.t));
  }
}

// ---------- projectiles / effects ----------
const shots = [];
const shotGeo = new THREE.SphereGeometry(0.13, 6, 5);
const shotsGroup = new THREE.Group();
scene.add(shotsGroup);

const fires = [];
const fireGeo = new THREE.CircleGeometry(1.6, 20);
const fireMat = new THREE.MeshBasicMaterial({ color: 0xff5a1a, transparent: true, opacity: 0.35, depthWrite: false });

// chain lightning lines
const zaps = [];
const zapMat = new THREE.LineBasicMaterial({ color: 0x7fd0ff, transparent: true });
const zapGroup = new THREE.Group();
scene.add(zapGroup);

// xp gems
const gems = [];
const gemGeo = new THREE.OctahedronGeometry(0.18);
const gemMat = new THREE.MeshStandardMaterial({ color: 0x7fe0c0, emissive: 0x0d6a50, emissiveIntensity: 1.4 });

// floating text in 3D is expensive — keep a 2D list projected to screen
const texts = [];
function floatText3(x, z, str, color) {
  const [sx, sy] = project(x, WALK(x, z) + 1.6, z);
  texts.push({ x: sx, y: sy, str: String(str), color, life: 0.8, vy: -30 });
}
let hudMsg = { text: '', color: '#fff', t: 0 };
function floatMsg(text, color = '#fff') { hudMsg = { text, color, t: 1.8 }; }

function project(x, y, z) {
  const v = new THREE.Vector3(x, y, z).project(camera);
  return [(v.x * 0.5 + 0.5) * (uiCanvas.width / dpr), (-v.y * 0.5 + 0.5) * (uiCanvas.height / dpr)];
}

// particles
const parts = [];
function burst(x, z, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU);
    parts.push({ x, z, vx: Math.cos(a) * rand(3), vz: Math.sin(a) * rand(3), life: rand(0.4, 0.15) });
  }
}

// ---------- combat update ----------
function nearestEnemy(x, z, maxD = 1e9) {
  let best = null, bd = maxD;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = dist2(x, z, e.x, e.z);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function updateItems(dt) {
  const dmgMul = 1 + (player.level - 1) * 0.05;
  for (const it of items) {
    const def = ITEM_DEFS[it.id];
    const lvlMul = 1 + (it.level - 1) * 0.35;
    const cd = (def.cd || 1) / lvlMul;

    if (def.kind === 'orbit') {
      it.angle += dt * 2.4;
      const ox = player.x + Math.cos(it.angle) * 1.6, oz = player.z + Math.sin(it.angle) * 1.6;
      it.timer -= dt;
      if (it.timer <= 0) {
        it.timer = 0.18;
        for (const e of enemies) if (!e.dead && dist2(ox, oz, e.x, e.z) < e.r + 0.5) hitEnemy(e, def.dmg * lvlMul * dmgMul, def.color);
      }
      continue;
    }
    if (def.kind === 'aura') {
      it.timer -= dt;
      if (it.timer <= 0) {
        it.timer = cd;
        const R = def.radius * (1 + (it.level - 1) * 0.15);
        for (const e of enemies) if (!e.dead && dist2(player.x, player.z, e.x, e.z) < R + e.r) hitEnemy(e, def.dmg * lvlMul * dmgMul, def.color);
      }
      continue;
    }
    if (def.kind === 'passive' || def.kind === 'heal') continue;

    it.timer -= dt;
    if (it.timer > 0) continue;

    if (def.kind === 'melee') {
      it.timer = cd;
      for (const e of enemies) if (!e.dead && dist2(player.x, player.z, e.x, e.z) < 2.6 + e.r) hitEnemy(e, def.dmg * lvlMul * dmgMul, def.color);
    } else if (def.kind === 'shot') {
      const tgt = nearestEnemy(player.x, player.z, 20);
      if (!tgt) continue;
      it.timer = cd;
      const a = Math.atan2(tgt.z - player.z, tgt.x - player.x);
      const m = new THREE.Mesh(shotGeo, new THREE.MeshBasicMaterial({ color: def.color }));
      m.position.set(player.x + Math.cos(a), WALK(player.x, player.z) + 1.1, player.z + Math.sin(a));
      shotsGroup.add(m);
      shots.push({ m, vx: Math.cos(a) * def.speed, vz: Math.sin(a) * def.speed, dmg: def.dmg * lvlMul * dmgMul, life: 0.8, pierce: def.pierce || 0, color: def.color, hit: new Set() });
    } else if (def.kind === 'chain') {
      const tgt = nearestEnemy(player.x, player.z, def.range);
      if (!tgt) continue;
      it.timer = cd;
      const pts = [new THREE.Vector3(player.x, player.y + 1.2, player.z)];
      let cur = tgt;
      const used = new Set();
      for (let c = 0; c < def.chains + (it.level - 1); c++) {
        if (!cur || used.has(cur)) break;
        used.add(cur);
        pts.push(new THREE.Vector3(cur.x, WALK(cur.x, cur.z) + 0.8, cur.z));
        hitEnemy(cur, def.dmg * lvlMul * dmgMul, def.color);
        let next = null, nd = 9;
        for (const e of enemies) {
          if (e.dead || used.has(e)) continue;
          const d = dist2(cur.x, cur.z, e.x, e.z);
          if (d < nd) { nd = d; next = e; }
        }
        cur = next;
      }
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), zapMat.clone());
      zapGroup.add(line);
      zaps.push({ line, life: 0.15 });
    } else if (def.kind === 'fire') {
      const tgt = nearestEnemy(player.x, player.z, 12);
      if (!tgt) continue;
      it.timer = cd;
      const m = new THREE.Mesh(fireGeo, fireMat.clone());
      m.rotation.x = -Math.PI / 2;
      m.position.set(tgt.x, WALK(tgt.x, tgt.z) + 0.03, tgt.z);
      scene.add(m);
      fires.push({ m, x: tgt.x, z: tgt.z, life: 3.0, tick: 0, dmg: def.dmg * lvlMul * dmgMul });
    }
  }
}

function updateShots(dt) {
  for (const s of shots) {
    s.m.position.x += s.vx * dt;
    s.m.position.z += s.vz * dt;
    s.life -= dt;
    for (const e of enemies) {
      if (e.dead || s.hit.has(e)) continue;
      if (dist2(s.m.position.x, s.m.position.z, e.x, e.z) < e.r + 0.25) {
        hitEnemy(e, s.dmg, s.color);
        s.hit.add(e);
        if (s.pierce-- <= 0) { s.life = 0; break; }
      }
    }
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    if (shots[i].life <= 0) { shotsGroup.remove(shots[i].m); shots.splice(i, 1); }
  }
}

function updateEffects(dt) {
  for (const f of fires) {
    f.life -= dt;
    f.tick -= dt;
    f.m.material.opacity = clamp(f.life / 3, 0, 1) * 0.35;
    if (f.tick <= 0) {
      f.tick = 0.3;
      for (const e of enemies) if (!e.dead && dist2(f.x, f.z, e.x, e.z) < 1.6 + e.r) hitEnemy(e, f.dmg, '#ff8a3a');
    }
    if (f.life <= 0) { scene.remove(f.m); }
  }
  for (let i = fires.length - 1; i >= 0; i--) if (fires[i].life <= 0) fires.splice(i, 1);

  for (const z of zaps) {
    z.life -= dt;
    z.line.material.opacity = clamp(z.life / 0.15, 0, 1);
  }
  for (let i = zaps.length - 1; i >= 0; i--) {
    if (zaps[i].life <= 0) { zapGroup.remove(zaps[i].line); zaps[i].line.geometry.dispose(); zaps[i].line.material.dispose(); zaps.splice(i, 1); }
  }
}

function updateGems(dt) {
  const magnetR = items.some((i) => i.id === 'magnet') ? 7 : 2.4;
  for (const g of gems) {
    g.life -= dt;
    const d = dist2(g.x, g.z, player.x, player.z);
    if (d < magnetR) {
      const pull = lerp(1.5, 9, 1 - d / magnetR);
      g.x += (player.x - g.x) / d * pull * dt;
      g.z += (player.z - g.z) / d * pull * dt;
    }
    if (d < 0.9) { g.taken = true; player.xp += g.v; }
  }
  for (let i = gems.length - 1; i >= 0; i--) if (gems[i].taken || gems[i].life <= 0) gems.splice(i, 1);
}
function spawnGemMesh(g) {
  if (!g.m) { g.m = new THREE.Mesh(gemGeo, gemMat); scene.add(g.m); }
  g.m.position.set(g.x, WALK(g.x, g.z) + 0.5, g.z);
  g.m.rotation.y += 0.05;
}

// ---------- camera ----------
const cam = { yaw: Math.PI, pitch: 0.26, dist: 6.4, pos: new THREE.Vector3(0, 5, 9) };
let shake = 0;

// ---------- input ----------
const keys = new Set();
addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'Enter' || (e.code === 'Space' && state !== 'play')) {
    if (state === 'title' || state === 'dead') startRun();
  }
  if (state === 'levelup' && /^Digit[123]$/.test(e.code)) {
    const i = +e.code.slice(5) - 1;
    if (offers[i]) { addItem(offers[i]); offers = []; state = 'play'; }
  }
  if (state === 'play' && e.code === 'KeyX') dropHeaviest();
  if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));

let dragging = false, lastX = 0, lastY = 0;
glCanvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => (dragging = false));
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  cam.yaw -= (e.clientX - lastX) * 0.006;
  cam.pitch = clamp(cam.pitch + (e.clientY - lastY) * 0.004, -0.08, 0.9);
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('wheel', (e) => { cam.dist = clamp(cam.dist + e.deltaY * 0.006, 3.5, 12); }, { passive: true });
uiCanvas.addEventListener('pointerdown', (e) => {
  if (state === 'levelup') {
    for (let i = 0; i < cardRects.length; i++) {
      const r = cardRects[i];
      if (e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) {
        if (offers[i]) { addItem(offers[i]); offers = []; state = 'play'; }
        return;
      }
    }
  } else if (state === 'title' || state === 'dead') startRun();
});
uiCanvas.style.pointerEvents = 'none';
addEventListener('mousedown', (e) => {
  if (e.target !== glCanvas && (state === 'title' || state === 'dead' || state === 'levelup')) {
    if (state === 'title' || state === 'dead') startRun();
  }
});

// ---------- telemetry hook ----------
const telemetry = { on: false, frames: [] };
window.WALKER_TELEMETRY = telemetry;
addEventListener('keydown', (e) => {
  if (e.code === 'KeyT' && state === 'play') {
    telemetry.on = !telemetry.on;
    floatMsg(telemetry.on ? 'TELEMETRY ON' : 'TELEMETRY OFF', '#7fe0c0');
  }
});

// ---------- run state ----------
let state = 'title';
let offers = [];
let cardRects = [];
let best = 0;

function startRun() {
  player.x = 0; player.z = 0; player.yaw = 0; player.speed = 0; player.phase = 0;
  player.hp = 100; player.maxHp = 100; player.stability = 1; player.falling = 0;
  player.hurtCd = 0; player.xp = 0; player.xpNext = 8; player.level = 1; player.kills = 0; player.t = 0;
  items.length = 0; load = 0; featherBonus = 0;
  for (const e of enemies) scene.remove(e.g);
  enemies.length = 0;
  for (const s of shots) shotsGroup.remove(s.m);
  shots.length = 0;
  for (const g of gems) if (g.m) scene.remove(g.m);
  gems.length = 0;
  for (const f of fires) scene.remove(f.m);
  fires.length = 0;
  for (const z of zaps) { zapGroup.remove(z.line); }
  zaps.length = 0;
  texts.length = 0;
  spawnTimer = 1.0;
  addItem('wrench');
  recomputeLoad();
  lastCI = 1e9;
  updateChunks(0, 0);
  state = 'play';
  floatMsg('LOAD UP — survivors inbound', '#ffb04a');
}

// ---------- update ----------
function updatePlayer(dt) {
  const f = new THREE.Vector3(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
  const r = new THREE.Vector3(-f.z, 0, f.x);
  let ix = 0, iz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  const moving = (ix || iz) !== 0 && player.falling <= 0;

  const dir = new THREE.Vector3().addScaledVector(f, iz).addScaledVector(r, ix);
  if (moving) dir.normalize();

  const base = 3.4 * speedFactor();
  const target = moving ? base : 0;
  player.speed = lerp(player.speed, target, 1 - Math.exp(-dt * 8));

  if (player.speed > 0.05 && (ix || iz)) {
    player.x += dir.x * player.speed * dt;
    player.z += dir.z * player.speed * dt;
    player.yaw = angleLerp(player.yaw, Math.atan2(dir.x, dir.z), 1 - Math.exp(-dt * 10));
  }
  player.y = WALK(player.x, player.z);

  // stability: the bag's weight drains you while you move
  if (player.falling > 0) {
    player.falling -= dt;
    if (player.falling <= 0) player.stability = 0.6;
  } else {
    const drain = moving ? 0.055 + load * 0.022 : -0.9;
    player.stability = clamp(player.stability - drain * dt, 0, 1);
    if (player.stability <= 0) {
      player.falling = 1.1;
      shake = 9;
      hurt(4, false);
      if (state !== 'play') return;
      dropHeaviest();
      floatMsg('YOU FELL — lost your heaviest item', '#ff8a5a');
    }
  }
  if (player.hurtCd > 0) player.hurtCd -= dt;

  // gait
  const cadence = GAIT.cadence * clamp(player.speed / 3.4, 0.35, 1.7);
  player.phase += dt * cadence * TAU * (player.speed > 0.05 ? 1 : 0);
  if (player.speed <= 0.05) player.phase += dt * 0.6;

  if (telemetry.on && telemetry.frames.length < 20000) {
    telemetry.frames.push({
      t: +player.t.toFixed(3), speed: +player.speed.toFixed(3),
      hipL: +J.hipL.rotation.x.toFixed(4), hipR: +J.hipR.rotation.x.toFixed(4),
      kneeL: +J.kneeL.rotation.x.toFixed(4), kneeR: +J.kneeR.rotation.x.toFixed(4),
      shoulderL: +J.shL.rotation.x.toFixed(4), shoulderR: +J.shR.rotation.x.toFixed(4),
    });
  }
}

function poseWalker(t) {
  const sp = clamp(player.speed / 3.4, 0, 1.4);
  const p = player.phase;
  const sw = Math.sin(p), cw = Math.cos(p);
  const amp = clamp(sp, 0, 1);
  const fall = player.falling > 0 ? clamp(1 - player.falling / 1.1, 0, 1) : 0;

  J.hipL.rotation.x = -GAIT.hipSwing * amp * sw - Math.sin(fall * Math.PI) * 0.5;
  J.hipR.rotation.x = GAIT.hipSwing * amp * sw - Math.sin(fall * Math.PI) * 0.3;
  J.kneeL.rotation.x = GAIT.kneePeak * amp * Math.max(0, -cw) + 0.06 + Math.sin(fall * Math.PI) * 0.9;
  J.kneeR.rotation.x = GAIT.kneePeak * amp * Math.max(0, cw) + 0.06 + Math.sin(fall * Math.PI) * 0.6;
  J.ankleL.rotation.x = -GAIT.ankleSwing * amp * Math.max(0, -sw);
  J.ankleR.rotation.x = -GAIT.ankleSwing * amp * Math.max(0, sw);
  J.shL.rotation.x = GAIT.armSwing * amp * sw - Math.sin(fall * Math.PI) * 0.7;
  J.shR.rotation.x = -GAIT.armSwing * amp * sw - Math.sin(fall * Math.PI) * 0.7;
  J.elL.rotation.x = -0.18 - 0.3 * amp;
  J.elR.rotation.x = -0.18 - 0.3 * amp;
  J.shL.rotation.z = 0.1; J.shR.rotation.z = -0.1;

  J.hips.position.y = 1.02 + (Math.abs(cw) * GAIT.bob * amp) - items.length * 0.004;
  J.torso.rotation.x = GAIT.lean * amp + items.length * 0.006 + Math.sin(t * 1.4) * 0.012 + fall * 0.55;
  J.torso.rotation.z = 0.035 * amp * sw + (1 - player.stability) * 0.09 * Math.sin(t * 3.1);
  J.torso.rotation.y = -0.06 * amp * sw;
  J.neck.rotation.x = -0.05 * amp + Math.sin(t * 1.1) * 0.02;

  walker.userData.cargoBoxes.forEach((b, i) => { b.visible = i < items.length; });
}

function updateEnemies(dt, t) {
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = player.x - e.x, dz = player.z - e.z;
    const d = Math.hypot(dx, dz) || 1;
    e.x += (dx / d) * e.spd * dt;
    e.z += (dz / d) * e.spd * dt;
    e.g.position.set(e.x, WALK(e.x, e.z) + (e.type === 'brute' ? 0.9 : 0.45), e.z);
    e.g.rotation.y = Math.atan2(dx, dz);
    e.body.position.y = Math.sin(t * 6 + e.wob) * 0.06;
    e.flash = Math.max(0, e.flash - dt);
    e.body.material.emissiveIntensity = e.flash > 0 ? 2.2 : (e.type === 'brute' ? 0.5 : 0.6);

    if (d < e.r + 0.55 && player.hurtCd <= 0 && player.falling <= 0) hurt(e.dmg);
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) enemies.splice(i, 1);
}

function updateCamera(dt) {
  const r = Math.cos(cam.pitch) * cam.dist;
  const hgt = Math.sin(cam.pitch) * cam.dist + 1.4;
  const tx = player.x + Math.sin(cam.yaw) * r;
  const tz = player.z + Math.cos(cam.yaw) * r;
  const ty = player.y + hgt;
  cam.pos.x = lerp(cam.pos.x, tx, 1 - Math.exp(-dt * 6));
  cam.pos.y = lerp(cam.pos.y, ty, 1 - Math.exp(-dt * 4));
  cam.pos.z = lerp(cam.pos.z, tz, 1 - Math.exp(-dt * 6));
  camera.position.copy(cam.pos);
  camera.lookAt(player.x, player.y + 1.25, player.z);
  window.__sky.position.copy(camera.position);
  sun.position.set(player.x + 30, player.y + 45, player.z + 18);
  sun.target.position.set(player.x, player.y, player.z);
  shake = Math.max(0, shake - dt * 30);
}

function update(dt, t) {
  player.t += dt;
  updatePlayer(dt);
  if (state !== 'play') return;
  updateItems(dt);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(0.25, 1.2 - player.t * 0.02);
    const n = 1 + Math.floor(player.t / 18);
    for (let i = 0; i < n; i++) spawnEnemy();
  }
  updateEnemies(dt, t);
  updateShots(dt);
  updateEffects(dt);
  updateGems(dt);
  updateChunks(player.x, player.z);

  for (const g of gems) spawnGemMesh(g);

  if (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = 8 + player.level * 4.5;
    const pool = POOL.slice();
    offers = [];
    for (let i = 0; i < 3 && pool.length; i++) offers.push(pool.splice(Math.floor(rand(pool.length)), 1)[0]);
    state = 'levelup';
  }
}

// ---------- HUD ----------
const FONT = '600 12px ui-monospace, Menlo, Consolas, monospace';
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}
function bar(ctx, x, y, w, h, frac, colA, colB) {
  ctx.fillStyle = 'rgba(8,12,17,0.62)';
  roundRect(ctx, x, y, w, h, 3);
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, colA); g.addColorStop(1, colB);
  ctx.fillStyle = g;
  roundRect(ctx, x + 1, y + 1, Math.max(0, (w - 2) * clamp(frac, 0, 1)), h - 2, 2);
}

function drawHUD(t) {
  const W = uiCanvas.width / dpr, H = uiCanvas.height / dpr;
  uctx.clearRect(0, 0, W, H);
  uctx.save();
  uctx.textBaseline = 'middle';

  for (const tx of texts) {
    uctx.globalAlpha = clamp(tx.life * 2, 0, 1);
    uctx.fillStyle = tx.color;
    uctx.font = '700 13px ui-monospace, Menlo, monospace';
    uctx.textAlign = 'center';
    uctx.fillText(tx.str, tx.x, tx.y);
  }
  uctx.globalAlpha = 1;

  if (state === 'title') {
    uctx.textAlign = 'center';
    uctx.fillStyle = 'rgba(6,9,13,0.5)'; uctx.fillRect(0, 0, W, H);
    uctx.fillStyle = '#f0f4f8';
    uctx.font = '800 54px ui-monospace, Menlo, monospace';
    uctx.fillText('WALKER: BAGFALL', W / 2, H / 2 - 50);
    uctx.font = FONT;
    uctx.fillStyle = 'rgba(190,205,218,0.9)';
    uctx.fillText('every item in your bag fights for you — and every item makes you heavier', W / 2, H / 2);
    uctx.fillStyle = 'rgba(255,176,74,' + (0.6 + Math.sin(t * 3) * 0.3) + ')';
    uctx.fillText('PRESS ENTER TO LOAD UP', W / 2, H / 2 + 54);
    uctx.fillStyle = 'rgba(140,160,175,0.7)';
    uctx.fillText('WASD move · drag look · wheel zoom · X drop heaviest · T telemetry', W / 2, H - 54);
    uctx.restore();
    return;
  }

  // vitals
  bar(uctx, 20, 20, 210, 16, player.hp / player.maxHp, '#ff5a4d', '#ff9a5a');
  bar(uctx, 20, 41, 210, 10, player.stability, player.stability < 0.4 ? '#ff4d3d' : '#e8d44d', player.stability < 0.4 ? '#ff8a5a' : '#fff0a0');
  bar(uctx, 20, 56, 210, 6, player.xp / player.xpNext, '#7fe0c0', '#a8ffe0');
  uctx.font = '700 10px ui-monospace, Menlo, monospace';
  uctx.textAlign = 'left';
  uctx.fillStyle = 'rgba(255,255,255,0.9)';
  uctx.fillText('HULL ' + Math.ceil(player.hp) + ' · STABILITY · XP', 27, 29);

  uctx.fillStyle = 'rgba(200,215,225,0.8)';
  uctx.font = FONT;
  uctx.fillText('LOAD ' + load.toFixed(0) + '  ·  SPD ' + Math.round(speedFactor() * 100) + '%  ·  ITEMS ' + items.length, 20, 76);

  // timer / kills (top center)
  uctx.textAlign = 'center';
  uctx.fillStyle = '#f0f4f8';
  uctx.font = '700 24px ui-monospace, Menlo, monospace';
  const mm = Math.floor(player.t / 60), ss = Math.floor(player.t % 60);
  uctx.fillText(mm + ':' + String(ss).padStart(2, '0'), W / 2, 34);
  uctx.font = '600 10px ui-monospace, Menlo, monospace';
  uctx.fillStyle = 'rgba(160,180,195,0.8)';
  uctx.fillText('KILLS ' + player.kills + ' · BEST ' + best + 's', W / 2, 52);

  // level (top right)
  uctx.textAlign = 'right';
  uctx.fillStyle = '#f0f4f8';
  uctx.font = '700 18px ui-monospace, Menlo, monospace';
  uctx.fillText('LV ' + player.level, W - 20, 30);

  // item chips
  let cx = 20, cy = uiCanvas.height / dpr - 26;
  uctx.textAlign = 'left';
  for (const it of items) {
    const def = ITEM_DEFS[it.id];
    const label = def.name + (it.level > 1 ? ' +' + (it.level - 1) : '');
    uctx.font = '600 10px ui-monospace, Menlo, monospace';
    const tw = uctx.measureText(label).width + 16;
    if (cx + tw > W - 20) break;
    uctx.fillStyle = 'rgba(10,14,20,0.7)';
    uctx.fillRect(cx, cy - 12, tw, 16);
    uctx.strokeStyle = def.color + '77';
    uctx.strokeRect(cx + 0.5, cy - 11.5, tw - 1, 15);
    uctx.fillStyle = def.color;
    uctx.fillText(label, cx + 8, cy - 3);
    cx += tw + 6;
  }

  // center message
  if (hudMsg.t > 0) {
    uctx.globalAlpha = clamp(hudMsg.t, 0, 1);
    uctx.textAlign = 'center';
    uctx.fillStyle = hudMsg.color;
    uctx.font = '700 15px ui-monospace, Menlo, monospace';
    uctx.fillText(hudMsg.text, W / 2, H * 0.3);
    uctx.globalAlpha = 1;
  }

  // damage flash
  if (player.hurtCd > 0) {
    uctx.fillStyle = 'rgba(255,40,30,' + (player.hurtCd * 0.35) + ')';
    uctx.fillRect(0, 0, W, H);
  }

  // level up
  if (state === 'levelup') {
    uctx.fillStyle = 'rgba(6,9,13,0.82)'; uctx.fillRect(0, 0, W, H);
    uctx.textAlign = 'center';
    uctx.fillStyle = '#f0f4f8';
    uctx.font = '700 24px ui-monospace, Menlo, monospace';
    uctx.fillText('LEVEL ' + player.level + ' — CHOOSE AN ITEM', W / 2, H / 2 - 128);
    cardRects = [];
    const cw = 320, ch = 76, gap = 14;
    offers.forEach((id, i) => {
      const def = ITEM_DEFS[id];
      const x = W / 2 - cw / 2, y = H / 2 - 92 + i * (ch + gap);
      cardRects.push({ x, y, w: cw, h: ch });
      uctx.fillStyle = 'rgba(18,24,32,0.96)';
      uctx.fillRect(x, y, cw, ch);
      uctx.strokeStyle = def.color + '88';
      uctx.lineWidth = 1.5;
      uctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
      uctx.textAlign = 'left';
      uctx.fillStyle = def.color;
      uctx.font = '700 14px ui-monospace, Menlo, monospace';
      uctx.fillText('[' + (i + 1) + ']  ' + def.name, x + 18, y + 26);
      uctx.fillStyle = 'rgba(200,214,226,0.85)';
      uctx.font = '600 11px ui-monospace, Menlo, monospace';
      uctx.fillText(def.desc, x + 18, y + 46);
      uctx.textAlign = 'right';
      uctx.fillStyle = def.w >= 3 ? '#ff8a5a' : 'rgba(160,180,195,0.9)';
      uctx.font = '700 12px ui-monospace, Menlo, monospace';
      uctx.fillText('WEIGHT ' + def.w, x + cw - 18, y + 26);
    });
  }

  // dead
  if (state === 'dead') {
    uctx.fillStyle = 'rgba(12,6,6,0.82)'; uctx.fillRect(0, 0, W, H);
    uctx.textAlign = 'center';
    uctx.fillStyle = '#ff8a72';
    uctx.font = '800 40px ui-monospace, Menlo, monospace';
    uctx.fillText('BAG DOWN', W / 2, H / 2 - 56);
    uctx.fillStyle = '#f0f4f8';
    uctx.font = FONT;
    uctx.fillText('survived ' + player.t.toFixed(1) + 's · kills ' + player.kills + ' · level ' + player.level + ' · items ' + items.length, W / 2, H / 2);
    uctx.fillStyle = 'rgba(160,180,195,0.7)';
    uctx.fillText('best this session ' + best + 's', W / 2, H / 2 + 26);
    uctx.fillStyle = 'rgba(255,176,74,' + (0.6 + Math.sin(t * 3) * 0.3) + ')';
    uctx.fillText('PRESS ENTER TO LOAD UP AGAIN', W / 2, H / 2 + 72);
  }

  uctx.restore();
}

// ---------- resize ----------
let dpr = 1;
function resize() {
  const w = innerWidth, h = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  uiCanvas.width = Math.floor(w * dpr);
  uiCanvas.height = Math.floor(h * dpr);
  uctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- main loop ----------
updateChunks(0, 0);
let prev = performance.now();
let elapsed = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  elapsed += dt;

  if (state === 'play') update(dt, elapsed);
  else {
    poseWalker(elapsed);
    if (state === 'levelup' || state === 'dead' || state === 'title') {
      for (const tx of texts) { tx.y += tx.vy * dt; tx.life -= dt; }
      for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
      updateEffects(dt);
      if (hudMsg.t > 0) hudMsg.t -= dt;
    }
  }

  if (state === 'play' || state === 'levelup') {
    poseWalker(elapsed);
    walker.position.set(player.x, player.y, player.z);
    walker.rotation.y = player.yaw;
    walker.rotation.x = player.falling > 0 ? -Math.sin(clamp(1 - player.falling / 1.1, 0, 1) * Math.PI) * 0.6 : 0;
    updateCamera(dt);
  } else {
    walker.position.set(player.x, player.y, player.z);
    updateCamera(dt);
  }

  renderer.render(scene, camera);
  drawHUD(elapsed);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// debug handle
if (location.search.includes('debug')) {
  window.__wf = {
    player, items, get enemies() { return enemies; }, get state() { return state; },
    get offers() { return offers; },
    addItem, dropHeaviest,
    start() { startRun(); },
    setLoad(n) {
      items.length = 0;
      const ids = Object.keys(ITEM_DEFS).filter((k) => ITEM_DEFS[k].kind !== 'passive' && ITEM_DEFS[k].kind !== 'heal');
      for (let i = 0; i < n; i++) addItem(ids[i % ids.length]);
      recomputeLoad();
    },
    forceFall() { player.stability = 0.001; },
    hurt(n) { hurt(n); },
    teleport(x, z) { player.x = x; player.z = z; player.y = WALK(x, z); },
  };
}
</script>
