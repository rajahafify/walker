<script type="module">
import * as THREE from 'three';

/* ============================================================
   WALKER
   Death Stranding-ish traversal + roguelike run progression.
   All UI is drawn into a 2D canvas layered over the WebGL one.
   ============================================================ */

// ---------- tiny utils ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
const dist2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < 4; i++) { s += amp * vnoise(x * f, y * f); norm += amp; f *= 2; amp *= 0.5; }
  return s / norm;
}
function angleLerp(a, b, t) {
  const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}

// ---------- tuning ----------
// Gait is modelled on an average adult humanoid platform (~1.75 m, 68 kg):
// stride ~0.72 m, cadence ~1.9 steps/s at cruise, knee peak flexion ~60 deg
// in swing, counter-rotating arm swing ~25 deg. Keep these plausible if you
// retarget real hardware — the telemetry hook records them per frame.
const GAIT = {
  stride: 0.72,          // metres per full cycle
  cadence: 1.9,         // cycles per second at cruise speed
  hipSwing: 0.52,       // rad
  kneePeak: 1.02,       // rad (swing phase)
  ankleSwing: 0.28,
  armSwing: 0.42,
  bob: 0.035,
  lean: 0.09,
};

const CFG = {
  chunkSize: 45,
  chunkSeg: 11,        // vertices per side
  viewChunks: 2,       // radius -> 5x5 chunks = 225 units
};

const PALETTE = {
  fog: 0x1d2733,
  zenith: 0x0b1422,
  horizon: 0x33414f,
  sun: 0xffd7a8,
};

// ---------- renderer / scene ----------
const glCanvas = document.getElementById('gl');
const uiCanvas = document.getElementById('ui');
const uctx = uiCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setClearColor(PALETTE.fog);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.fog);
scene.fog = new THREE.FogExp2(PALETTE.fog, 0.018);

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);

// ---------- sky ----------
let sky;
{
  const skyGeo = new THREE.SphereGeometry(360, 24, 12);
  const pos = skyGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const top = new THREE.Color(PALETTE.zenith), hor = new THREE.Color(PALETTE.horizon);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = clamp((pos.getY(i) / 360 + 0.1) / 0.9, 0, 1);
    c.copy(hor).lerp(top, Math.pow(t, 0.65));
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -1;
  scene.add(sky);
}

// sun disc, drawn as an additive sprite from a canvas texture
function makeSunTexture() {
  const s = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,238,210,1)');
  g.addColorStop(0.18, 'rgba(255,220,170,0.9)');
  g.addColorStop(0.4, 'rgba(255,180,120,0.25)');
  g.addColorStop(1, 'rgba(255,160,90,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeSunTexture(), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true,
}));
sunSprite.scale.set(150, 150, 1);
scene.add(sunSprite);

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0x9db8d8, 0x2c2a20, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(PALETTE.sun, 2.3);
sun.position.set(30, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -42; sun.shadow.camera.right = 42;
sun.shadow.camera.top = 42; sun.shadow.camera.bottom = -42;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);
const rim = new THREE.DirectionalLight(0x5f7fff, 0.45);
rim.position.set(-30, 20, -40);
scene.add(rim);

// ---------- terrain (infinite, chunked) ----------
// analytic height field: the visual mesh is a sampled version of this,
// so the walker's feet and the ground always agree.
function WALK(x, z) {
  const base = 5.4 * (fbm(x * 0.011 + 11.3, z * 0.011 - 4.7) - 0.5);
  const roll = 1.3 * Math.sin(x * 0.013) * Math.cos(z * 0.017);
  const fine = 0.5 * (vnoise(x * 0.06, z * 0.06) - 0.5);
  return base + roll + fine;
}

const chunks = new Map();
const rockGeo = new THREE.IcosahedronGeometry(1, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x4a4a42, roughness: 1, flatShading: true });
const trunkGeo = new THREE.CylinderGeometry(0.07, 0.11, 1.6, 5);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2e2721, roughness: 1 });
const crownGeo = new THREE.IcosahedronGeometry(0.85, 0);
const crownMat = new THREE.MeshStandardMaterial({ color: 0x2c4430, roughness: 1, flatShading: true });
const salvageList = [];

function chunkKey(ci, cj) { return ci + ',' + cj; }

function buildChunk(ci, cj) {
  const size = CFG.chunkSize, seg = CFG.chunkSeg;
  const geo = new THREE.PlaneGeometry(size, size, seg - 1, seg - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const ox = ci * size + size / 2, oz = cj * size + size / 2;

  // bake world coordinates so chunk culling stays correct
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k) + ox, z = pos.getZ(k) + oz;
    pos.setX(k, x); pos.setZ(k, z);
    pos.setY(k, WALK(x, z));
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();

  const nrm = geo.attributes.normal;
  const colors = new Float32Array(pos.count * 3);
  const cLow = new THREE.Color(0x1d2a22), cMid = new THREE.Color(0x4a5238), cHigh = new THREE.Color(0x8a8474);
  const cRock = new THREE.Color(0x5c574c);
  const c = new THREE.Color();
  for (let k = 0; k < pos.count; k++) {
    const t = clamp((pos.getY(k) + 3.6) / 7.2, 0, 1);
    if (t < 0.5) c.copy(cLow).lerp(cMid, t * 2);
    else c.copy(cMid).lerp(cHigh, (t - 0.5) * 2);
    const slope = 1 - clamp(nrm.getY(k), 0, 1);
    c.lerp(cRock, clamp((slope - 0.18) * 2.6, 0, 0.85));
    colors[k * 3] = c.r; colors[k * 3 + 1] = c.g; colors[k * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0.0 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);

  // deterministic scattered props
  const key = chunkKey(ci, cj);
  const rnd = mulberry32((Math.imul(ci, 73856093) ^ Math.imul(cj, 19349663) ^ 0x9e3779b9) | 0);
  const props = new THREE.Group();
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3();

  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, 5);
  rocks.castShadow = true; rocks.receiveShadow = true;
  for (let i = 0; i < 5; i++) {
    const x = ox + (rnd() - 0.5) * size, z = oz + (rnd() - 0.5) * size;
    const s = 0.25 + rnd() * 0.9;
    p.set(x, WALK(x, z) - s * 0.25, z);
    q.setFromEuler(new THREE.Euler(rnd() * 3, rnd() * 6, rnd() * 3));
    sc.set(s, s * (0.5 + rnd() * 0.6), s);
    rocks.setMatrixAt(i, m4.compose(p, q, sc));
  }
  rocks.instanceMatrix.needsUpdate = true;
  props.add(rocks);

  const trees = new THREE.InstancedMesh(trunkGeo, trunkMat, 4);
  const crowns = new THREE.InstancedMesh(crownGeo, crownMat, 4);
  trees.castShadow = true; crowns.castShadow = true;
  for (let i = 0; i < 4; i++) {
    const x = ox + (rnd() - 0.5) * size, z = oz + (rnd() - 0.5) * size;
    const gy = WALK(x, z);
    const s = 0.7 + rnd() * 0.8;
    p.set(x, gy + 0.8 * s, z); q.setFromEuler(new THREE.Euler(0, rnd() * 6, 0)); sc.set(s, s, s);
    trees.setMatrixAt(i, m4.compose(p, q, sc));
    p.set(x, gy + 1.85 * s, z); sc.set(s, s * 1.15, s);
    crowns.setMatrixAt(i, m4.compose(p, q, sc));
  }
  trees.instanceMatrix.needsUpdate = true;
  crowns.instanceMatrix.needsUpdate = true;
  props.add(trees, crowns);
  scene.add(props);

  // occasional supply crate
  if (rnd() > 0.55) {
    const x = ox + (rnd() - 0.5) * size, z = oz + (rnd() - 0.5) * size;
    const crate = makeSalvage(x, WALK(x, z), z);
    crate.key = key;
    salvageList.push(crate);
  }

  chunks.set(key, { mesh, props, key });
}

function removeChunk(key) {
  const c = chunks.get(key);
  if (!c) return;
  scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose();
  scene.remove(c.props);
  for (let i = salvageList.length - 1; i >= 0; i--) {
    if (salvageList[i].key === key) {
      scene.remove(salvageList[i].mesh);
      salvageList.splice(i, 1);
    }
  }
  chunks.delete(key);
}

let lastChunkI = 1e9, lastChunkJ = 1e9;
function updateChunks(px, pz) {
  const size = CFG.chunkSize;
  const ci = Math.floor(px / size), cj = Math.floor(pz / size);
  if (ci === lastChunkI && cj === lastChunkJ) return;
  lastChunkI = ci; lastChunkJ = cj;
  const R = CFG.viewChunks;
  const wanted = new Set();
  for (let i = ci - R; i <= ci + R; i++)
    for (let j = cj - R; j <= cj + R; j++) {
      const k = chunkKey(i, j);
      wanted.add(k);
      if (!chunks.has(k)) buildChunk(i, j);
    }
  for (const k of [...chunks.keys()]) if (!wanted.has(k)) removeChunk(k);
}

// ---------- dust ----------
const DUST_N = 200;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustCol = new Float32Array(DUST_N * 3);
const dustVel = new Float32Array(DUST_N * 3);
const dustLife = new Float32Array(DUST_N);
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3).setUsage(THREE.DynamicDrawUsage));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3).setUsage(THREE.DynamicDrawUsage));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  size: 0.14, vertexColors: true, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending,
}));
dust.frustumCulled = false;
scene.add(dust);
let dustHead = 0;
function emitDust(x, y, z, n = 5) {
  for (let i = 0; i < n; i++) {
    const k = dustHead++ % DUST_N;
    dustPos[k * 3] = x + rand(0.22, -0.22);
    dustPos[k * 3 + 1] = y + rand(0.08, 0);
    dustPos[k * 3 + 2] = z + rand(0.22, -0.22);
    dustVel[k * 3] = rand(0.6, -0.6);
    dustVel[k * 3 + 1] = rand(0.9, 0.3);
    dustVel[k * 3 + 2] = rand(0.6, -0.6);
    dustLife[k] = 0.7;
  }
}
function updateDust(dt) {
  for (let k = 0; k < DUST_N; k++) {
    if (dustLife[k] <= 0) {
      dustCol[k * 3] = dustCol[k * 3 + 1] = dustCol[k * 3 + 2] = 0;
      continue;
    }
    dustLife[k] -= dt;
    dustPos[k * 3] += dustVel[k * 3] * dt;
    dustPos[k * 3 + 1] += dustVel[k * 3 + 1] * dt;
    dustPos[k * 3 + 2] += dustVel[k * 3 + 2] * dt;
    dustVel[k * 3 + 1] -= 2.2 * dt;
    const a = clamp(dustLife[k] / 0.7, 0, 1);
    dustCol[k * 3] = 0.52 * a; dustCol[k * 3 + 1] = 0.45 * a; dustCol[k * 3 + 2] = 0.34 * a;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.color.needsUpdate = true;
}

// ---------- audio (WebAudio synth, no assets) ----------
const audio = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* silent */ }
  },
  env(dur, vol) {
    const c = this.ctx; if (!c) return null;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    g.connect(c.destination);
    return g;
  },
  tone(freq, dur, type = 'sine', vol = 0.12, endFreq = null) {
    const c = this.ctx; if (!c) return;
    const g = this.env(dur, vol); if (!g) return;
    const o = c.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, c.currentTime + dur);
    o.connect(g); o.start(); o.stop(c.currentTime + dur);
  },
  noise(dur, vol = 0.06, cutoff = 600) {
    const c = this.ctx; if (!c) return;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = this.env(dur, vol); if (!g) return;
    src.connect(f); f.connect(g); src.start();
  },
};
const sfx = {
  step() { audio.noise(0.07, 0.045, 320 + Math.random() * 260); },
  jump() { audio.tone(180, 0.16, 'triangle', 0.07, 330); },
  land() { audio.noise(0.1, 0.07, 260); },
  pick() { audio.tone(660, 0.09, 'square', 0.045); setTimeout(() => audio.tone(990, 0.12, 'square', 0.045), 80); },
  deliver() { [523, 659, 784].forEach((f, i) => setTimeout(() => audio.tone(f, 0.32, 'sine', 0.08), i * 90)); },
  hit() { audio.tone(92, 0.25, 'sawtooth', 0.13, 38); audio.noise(0.16, 0.1, 220); },
  perk() { [440, 554, 659].forEach((f, i) => setTimeout(() => audio.tone(f, 0.16, 'triangle', 0.06), i * 70)); },
  fail() { audio.tone(220, 0.42, 'sawtooth', 0.07, 108); },
  hunter() { audio.tone(140, 0.3, 'square', 0.03, 90); },
};

// ---------- walker ----------
function makeWalker() {
  const shell = new THREE.MeshStandardMaterial({ color: 0xd4d6cf, roughness: 0.45, metalness: 0.25 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x23262b, roughness: 0.75, metalness: 0.3 });
  const glow = new THREE.MeshStandardMaterial({ color: 0xffa04d, emissive: 0xff6a00, emissiveIntensity: 1.6, roughness: 0.4 });
  const jointMat = new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.4, metalness: 0.6 });
  const J = {};
  const root = new THREE.Group();

  const hips = new THREE.Group(); hips.position.y = 1.02; root.add(hips); J.hips = hips;
  const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.18, 0.24), dark);
  hips.add(pelvis);

  const torso = new THREE.Group(); torso.position.y = 0.09; hips.add(torso); J.torso = torso;
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.44, 0.26), shell);
  chest.position.y = 0.24; torso.add(chest);
  const accent = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.015), glow);
  accent.position.set(0, 0.34, 0.135); torso.add(accent);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.30, 0.16), dark);
  pack.position.set(0, 0.26, -0.2); torso.add(pack);

  const cargoBoxes = [];
  for (let i = 0; i < 4; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.28 - i * 0.02, 0.09, 0.13), glow);
    b.position.set(0, 0.46 + i * 0.1, -0.21);
    b.visible = false;
    torso.add(b);
    cargoBoxes.push(b);
  }

  const neck = new THREE.Group(); neck.position.y = 0.5; torso.add(neck); J.neck = neck;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.22), shell);
  head.position.y = 0.12; neck.add(head);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.045, 0.02), glow);
  visor.position.set(0, 0.13, 0.115); neck.add(visor);
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.26, 3), jointMat);
  antenna.position.set(0.07, 0.34, -0.06); neck.add(antenna);

  // legs: hip -> thigh -> knee -> shin -> ankle -> foot
  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(0.11 * s, -0.05, 0); hips.add(hip);
    const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.46, 0.15), shell);
    thigh.position.y = -0.23; hip.add(thigh);
    const kneeBall = new THREE.Mesh(new THREE.SphereGeometry(0.062, 8, 6), jointMat);
    kneeBall.position.y = -0.46; hip.add(kneeBall);
    const knee = new THREE.Group(); knee.position.y = -0.46; hip.add(knee);
    const shin = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.44, 0.12), dark);
    shin.position.y = -0.22; knee.add(shin);
    const shinGlow = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.3, 0.012), glow);
    shinGlow.position.set(0, -0.2, 0.062); knee.add(shinGlow);
    const ankle = new THREE.Group(); ankle.position.y = -0.44; knee.add(ankle);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.07, 0.26), shell);
    foot.position.set(0, -0.035, 0.06); ankle.add(foot);
    const nm = s < 0 ? 'L' : 'R';
    J['hip' + nm] = hip; J['knee' + nm] = knee; J['ankle' + nm] = ankle;
  }
  // arms: shoulder -> upper -> elbow -> forearm
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(0.255 * s, 0.4, 0); torso.add(sh);
    const up = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.34, 0.1), shell);
    up.position.y = -0.17; sh.add(up);
    const el = new THREE.Group(); el.position.y = -0.34; sh.add(el);
    const lo = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.3, 0.09), dark);
    lo.position.y = -0.15; el.add(lo);
    const nm = s < 0 ? 'L' : 'R';
    J['sh' + nm] = sh; J['el' + nm] = el;
  }

  root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  root.userData = { J, cargoBoxes };
  return root;
}

const walker = makeWalker();
scene.add(walker);
const J = walker.userData.J;

// ---------- player ----------
const player = {
  x: 0, z: 0, y: 0, vy: 0, grounded: true, yaw: 0, speed: 0, phase: 0,
  hp: 100, stamina: 100, cargo: 0, sprinting: false, hurtCd: 0, prevSin: 0,
};

const stats = {};
function resetStats() {
  Object.assign(stats, {
    speedMul: 1, maxCargo: 3, cargoDrag: 1, maxStamina: 100, stamRegen: 1,
    stamDrain: 1, slopeResist: 0, scoreMul: 1, stormResist: 1, scanRange: 14,
    sprintCost: 1, hunterAggro: 1, hunterDamage: 1, dropCargo: true,
  });
}
resetStats();

const run = { score: 0, deliveries: 0, time: 0, streak: 0, best: 0 };
let gameState = 'title'; // title | play | perk | dead
let perkOffers = [];
let message = { text: '', sub: '', t: 0 };

const delivery = { x: 200, z: 0 };
const CONTRACT_TYPES = [
  { id: 'standard', name: 'STANDARD FREIGHT', desc: 'Deliver the cargo.', mult: 1 },
  { id: 'express', name: 'EXPRESS — BEAT THE CLOCK', desc: 'Late delivery voids the run bonus.', mult: 1.4 },

];

function placeDelivery() {
  const d = 165 + Math.min(260, run.deliveries * 22);
  const a = rand(TAU);
  delivery.x = player.x + Math.sin(a) * d;
  delivery.z = player.z + Math.cos(a) * d;
  beaconGroup.position.set(delivery.x, WALK(delivery.x, delivery.z), delivery.z);

  const type = CONTRACT_TYPES[Math.floor(rand(CONTRACT_TYPES.length))];
  const dist = dist2(player.x, player.z, delivery.x, delivery.z);
  contract = { ...type, dist, damaged: false, total: 0, timeLeft: 0 };
  if (type.id === 'express') {
    contract.total = Math.max(28, dist / 5.2);
    contract.timeLeft = contract.total;
  }
}

// ---------- storms ----------
const storms = [];
const stormGeo = new THREE.BufferGeometry();
const STORM_PTS = 700;
{
  const pts = new Float32Array(STORM_PTS * 3);
  for (let i = 0; i < STORM_PTS; i++) {
    const a = rand(TAU), r = Math.sqrt(rand(1)) * 34, y = rand(14);
    pts[i * 3] = Math.cos(a) * r; pts[i * 3 + 1] = y; pts[i * 3 + 2] = Math.sin(a) * r;
  }
  stormGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3).setUsage(THREE.DynamicDrawUsage));
}
const stormMat = new THREE.PointsMaterial({ color: 0x9aa6b8, size: 0.2, transparent: true, opacity: 0.5, depthWrite: false });

function relocateStorm(s) {
  const a = rand(TAU), d = 190 + rand(220);
  s.x = player.x + Math.sin(a) * d;
  s.z = player.z + Math.cos(a) * d;
  s.radius = 34 + rand(18);
  s.points.position.set(s.x, WALK(s.x, s.z), s.z);
}
function ensureStorms(n) {
  while (storms.length < n) {
    const s = { x: 0, z: 0, radius: 40, points: new THREE.Points(stormGeo, stormMat) };
    relocateStorm(s);
    scene.add(s.points);
    storms.push(s);
  }
}

// ---------- hounds (hunters) ----------
const hounds = [];
const houndMat = new THREE.MeshStandardMaterial({ color: 0x1a1d22, emissive: 0xff2a2a, emissiveIntensity: 1.5, roughness: 0.35, metalness: 0.4 });
const houndRingMat = new THREE.MeshBasicMaterial({ color: 0xff3a3a, transparent: true, opacity: 0.6 });
function makeHound() {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.48, 0), houndMat);
  g.add(core);
  const ringM = new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.035, 6, 26), houndRingMat);
  ringM.rotation.x = Math.PI / 2;
  g.add(ringM);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff6a4a }));
  eye.position.z = 0.42;
  g.add(eye);
  g.userData = { core, ring: ringM, home: { x: 0, z: 0 }, bob: rand(TAU), cooldown: 0 };
  scene.add(g);
  return g;
}
function ensureHounds(n) {
  while (hounds.length < n) {
    const h = makeHound();
    const a = rand(TAU), d = 60 + rand(60);
    h.userData.home = { x: player.x + Math.sin(a) * d, z: player.z + Math.cos(a) * d };
    h.position.set(h.userData.home.x, 0, h.userData.home.z);
    hounds.push(h);
  }
  while (hounds.length > n) scene.remove(hounds.pop());
}

const keys = new Set();

addEventListener('keydown', (e) => {

  if (e.code === 'KeyT' && gameState === 'play') { telemetry.on = !telemetry.on; say(telemetry.on ? 'TELEMETRY ON' : 'TELEMETRY OFF'); }
  if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));

let dragging = false, lastX = 0, lastY = 0;
glCanvas.addEventListener('pointerdown', (e) => { audio.init(); dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => (dragging = false));

function offerPerks() {
  const pool = PERK_POOL.slice();
  perkOffers = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    perkOffers.push(pool.splice(Math.floor(rand(pool.length)), 1)[0]);
  }

// ---------- damage ----------
function damage(amount, src) {
  if (gameState !== 'play') return;
  player.hp -= amount;
  player.hurtCd = 0.35;
  if (contract && contract.id === 'fragile') contract.damaged = true;
  run.streak = 0;
  if (src === 'hound') sfx.hit();
  if (player.hp <= 0) {
    player.hp = 0;
    run.best = Math.max(run.best, run.score);
    gameState = 'dead';
  }
}

// ---------- run lifecycle ----------
function startRun() {
  player.x = 0; player.z = 0; player.yaw = 0; player.speed = 0; player.phase = 0;
  player.hp = 100; player.cargo = 0; player.vy = 0; player.grounded = true;
  resetStats(); player.stamina = stats.maxStamina;
  run.score = 0; run.deliveries = 0; run.time = 0; run.streak = 0;
  lastChunkI = 1e9; lastChunkJ = 1e9;
  updateChunks(0, 0);
  telemetry.frames = [];
  ensureStorms(4);
  ensureHounds(1);
  placeDelivery();
  for (const s of storms) relocateStorm(s);
  gameState = 'play';
  say('CONTRACT ACCEPTED', 'Deliver to the beacon. Do not die out there.', 3.2);
}

// ---------- update ----------
function updatePlayer(dt) {
  const f = new THREE.Vector3(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
  const r = new THREE.Vector3(-f.z, 0, f.x);
  let ix = 0, iz = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  const moving = ix !== 0 || iz !== 0;

  const dir = new THREE.Vector3().addScaledVector(f, iz).addScaledVector(r, ix);
  if (moving) dir.normalize();

  const wantSprint = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const canSprint = wantSprint && moving && player.stamina > 1 && player.grounded;
  player.sprinting = canSprint;

  const baseSpeed = 3.1 * stats.speedMul * (canSprint ? 1.5 : 1);
  const cargoPenalty = 1 / (1 + player.cargo * 0.16 * stats.cargoDrag);
  const contractPenalty = contract && contract.id === 'heavy' ? 0.88 : 1;
  const h = WALK(player.x, player.z);
  const hAhead = WALK(player.x + dir.x * 1.2, player.z + dir.z * 1.2);
  const slope = moving ? (hAhead - h) / 1.2 : 0;
  const uphill = clamp(slope, -1, 1);
  const slopeFactor = clamp(1 - uphill * (0.9 - stats.slopeResist), 0.42, 1.25);

  const exhausted = player.stamina <= 0.5;
  const target = moving && !exhausted ? baseSpeed * cargoPenalty * contractPenalty * slopeFactor : 0;
  player.speed = lerp(player.speed, target, 1 - Math.exp(-dt * 7));

  if (player.speed > 0.05) {
    player.x += dir.x * player.speed * dt;
    player.z += dir.z * player.speed * dt;
    const wantYaw = Math.atan2(dir.x, dir.z);
    player.yaw = angleLerp(player.yaw, wantYaw, 1 - Math.exp(-dt * 10));
  }

  // vertical: jump + gravity over the analytic ground
  const ground = WALK(player.x, player.z);
  if (jumpQueued && player.grounded) {
    player.vy = 6.2;
    player.grounded = false;
    sfx.jump();
  }
  jumpQueued = false;
  if (!player.grounded) {
    player.vy -= 20 * dt;
    player.y += player.vy * dt;
    if (player.y <= ground) {
      player.y = ground; player.vy = 0; player.grounded = true;
      emitDust(player.x, player.y, player.z, 8);
      sfx.land();
    }
  } else {
    player.y = ground;
  }

  // stamina
  const effort = moving ? (0.5 + Math.max(0, uphill) * 1.4) * (canSprint ? 2.6 : 1) * stats.sprintCost : 0;
  if (moving && !exhausted) player.stamina -= effort * 6.2 * dt * stats.stamDrain;
  else player.stamina += 9 * dt * stats.stamRegen;
  player.stamina = clamp(player.stamina, 0, stats.maxStamina);

  // storm exposure
  let inStorm = false;
  for (const s of storms) {
    if (dist2(player.x, player.z, s.x, s.z) < s.radius) { inStorm = true; break; }
  }
  if (inStorm) {
    player.stamina = Math.max(0, player.stamina - 14 * dt);
    player.hp -= 2.4 * dt * stats.stormResist;
    if (player.hp <= 0) { player.hp = 0; run.best = Math.max(run.best, run.score); gameState = 'dead'; }
  }
  if (player.hurtCd > 0) player.hurtCd -= dt;

  // gait phase + footfalls
  const cadence = GAIT.cadence * clamp(player.speed / 3.1, 0.35, 1.7);
  player.phase += dt * cadence * TAU * (player.speed > 0.05 ? 1 : 0);
  if (player.speed <= 0.05) player.phase += dt * 0.6; // idle drift
  const s = Math.sin(player.phase);
  if (player.grounded && player.speed > 0.6 && Math.sign(s) !== Math.sign(player.prevSin)) {
    emitDust(player.x, player.y, player.z, player.sprinting ? 6 : 3);
    sfx.step();
  }
  player.prevSin = s;

  recordFrame(slope);
  return inStorm;
}

function poseWalker(t, inStorm) {
  const sp = clamp(player.speed / 3.1, 0, 1.4);
  const p = player.phase;
  const sw = Math.sin(p), cw = Math.cos(p);
  const amp = clamp(sp, 0, 1);
  const air = player.grounded ? 0 : 1;

  // legs — hip extension/flexion; knee flexion peaks mid-swing,
  // plus a small stance-phase flex like a real loading response
  J.hipL.rotation.x = -GAIT.hipSwing * amp * sw - air * 0.5;
  J.hipR.rotation.x = GAIT.hipSwing * amp * sw - air * 0.2;
  J.kneeL.rotation.x = GAIT.kneePeak * amp * Math.max(0, -cw) + 0.06 + air * 0.9;
  J.kneeR.rotation.x = GAIT.kneePeak * amp * Math.max(0, cw) + 0.06 + air * 0.5;
  J.ankleL.rotation.x = -GAIT.ankleSwing * amp * Math.max(0, -sw);
  J.ankleR.rotation.x = -GAIT.ankleSwing * amp * Math.max(0, sw);

  // arms counter-swing
  J.shL.rotation.x = GAIT.armSwing * amp * sw - air * 0.6;
  J.shR.rotation.x = -GAIT.armSwing * amp * sw - air * 0.6;
  J.elL.rotation.x = -0.18 - 0.3 * amp;
  J.elR.rotation.x = -0.18 - 0.3 * amp;

  // torso: vertical bob, forward lean with speed + cargo, lateral sway
  const bob = player.grounded ? Math.abs(cw) * GAIT.bob * amp : 0;
  J.hips.position.y = 1.02 + bob - (player.cargo * 0.012);
  J.torso.rotation.x = GAIT.lean * amp + player.cargo * 0.02 + Math.sin(t * 1.4) * 0.012;
  J.torso.rotation.z = 0.035 * amp * sw;
  J.torso.rotation.y = -0.06 * amp * sw;
  J.neck.rotation.x = -0.05 * amp + Math.sin(t * 1.1) * 0.02;
  J.neck.rotation.y = 0.08 * amp * sw;

  // storm buffeting
  if (inStorm) {
    J.torso.rotation.z += Math.sin(t * 7.3) * 0.05;
    J.torso.rotation.x += Math.sin(t * 5.1) * 0.04;
    J.shL.rotation.z = 0.25 + Math.sin(t * 6) * 0.06;
    J.shR.rotation.z = -0.25 - Math.sin(t * 6.4) * 0.06;
  } else {
    J.shL.rotation.z = 0.1;
    J.shR.rotation.z = -0.1;
  }

  // cargo stack
  walker.userData.cargoBoxes.forEach((b, i) => { b.visible = i < player.cargo; });
}

function updateHounds(dt, t) {
  const cargoSense = 1 + player.cargo * 0.12;
  const aggro = 24 * stats.hunterAggro * cargoSense;
  for (const h of hounds) {
    const u = h.userData;
    const d = dist2(h.position.x, h.position.z, player.x, player.z);
    let tx, tz, spd;
    if (d < aggro) {
      tx = player.x; tz = player.z;
      spd = 2.5;
      if (d < 16) sfx.hunter();
    } else {
      tx = u.home.x; tz = u.home.z;
      spd = 1.1;
      if (dist2(h.position.x, h.position.z, u.home.x, u.home.z) < 2) {
        const a = rand(TAU);
        u.home.x = clamp(u.home.x + Math.sin(a) * 30, player.x - 150, player.x + 150);
        u.home.z = clamp(u.home.z + Math.cos(a) * 30, player.z - 150, player.z + 150);
      }
    }
    const dx = tx - h.position.x, dz = tz - h.position.z;
    const len = Math.hypot(dx, dz) || 1;
    h.position.x += (dx / len) * spd * dt;
    h.position.z += (dz / len) * spd * dt;
    h.position.y = WALK(h.position.x, h.position.z) + 2.0 + Math.sin(t * 2.4 + u.bob) * 0.18;
    u.core.rotation.y += dt * 2.2;
    u.core.rotation.x += dt * 1.1;
    u.ring.rotation.z += dt * 1.6;

    // contact
    u.cooldown = Math.max(0, u.cooldown - dt);
    if (d < 1.15 && u.cooldown === 0) {
      u.cooldown = 1.4;
      damage(16 * stats.hunterDamage, 'hound');
      const push = 2.4;
      player.x += (player.x - h.position.x) / (d || 1) * push;
      player.z += (player.z - h.position.z) / (d || 1) * push;
      if (stats.dropCargo && player.cargo > 0) {
        player.cargo--;
        say('CARGO LOST', 'The hound tore a crate off your back.', 2);
      }
    }
  }
}

function updateCamera(dt) {
  const r = Math.cos(cam.pitch) * cam.dist;
  const hgt = Math.sin(cam.pitch) * cam.dist + 1.4;
  const tx = player.x + Math.sin(cam.yaw) * r;
  const tz = player.z + Math.cos(cam.yaw) * r;
  const ty = player.y + hgt;
  cam.pos.x = lerp(cam.pos.x, tx, 1 - Math.exp(-dt * 6));
  cam.pos.y = lerp(cam.pos.y, ty, 1 - Math.exp(-dt * 4));
  cam.pos.z = lerp(cam.pos.z, tz, 1 - Math.exp(-dt * 6));
  camera.position.copy(cam.pos);
  camera.lookAt(player.x, player.y + 1.25, player.z);

  // sky + sun follow the camera so the horizon never ends
  sky.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(new THREE.Vector3(30, 45, 18).normalize(), 300);

  // shadow frustum tracks the player
  sun.position.set(player.x + 30, player.y + 45, player.z + 18);
  sun.target.position.set(player.x, player.y, player.z);
}

function updateWorld(dt, t) {
  updateChunks(player.x, player.z);

  // beacon pulse
  ring.scale.setScalar(1 + Math.sin(t * 2.2) * 0.06);
  ring2.scale.setScalar(1 + Math.sin(t * 2.2 + 1) * 0.08);
  beam.material.opacity = 0.12 + Math.sin(t * 1.7) * 0.04;

  if (gameState === 'play') {
    // express timer
    if (contract && contract.id === 'express') {
      contract.timeLeft -= dt;
      if (contract.timeLeft <= 0) {
        sfx.fail();
        say('CONTRACT FAILED', 'Too slow. The client reposted it.', 2.6);
        placeDelivery();
      }
    }

    // delivery check
    if (dist2(player.x, player.z, delivery.x, delivery.z) < 3.2) {
      completeDelivery();
    }
  }

  // salvage pickup
  for (const s of salvageList) {
    if (s.taken) continue;
    s.mesh.rotation.y += dt * 1.4;
    s.mesh.position.y = WALK(s.x, s.z) + 0.6 + Math.sin(t * 2 + s.x) * 0.1;
    if (gameState === 'play' && dist2(player.x, player.z, s.x, s.z) < 1.7) {
      s.taken = true;
      scene.remove(s.mesh);
      if (player.cargo < stats.maxCargo) { player.cargo++; sfx.pick(); say('CARGO +1', 'Heavier now. Worth more on delivery.', 1.8); }
      else { run.score += 30; sfx.pick(); say('CARGO FULL', '+30 salvage', 1.8); }
    }
  }

  // storms drift + rain
  const rain = stormGeo.attributes.position;
  for (let i = 0; i < STORM_PTS; i++) {
    let y = rain.getY(i) - dt * 16;
    if (y < 0) y += 14;
    rain.setY(i, y);
  }
  rain.needsUpdate = true;
  for (const s of storms) {
    s.points.rotation.y += dt * 0.25;
    if (dist2(player.x, player.z, s.x, s.z) > 560) relocateStorm(s);
  }

  updateHounds(dt, t);
  updateDust(dt);
}

function completeDelivery() {
  const mult = contract.mult * (1 + Math.min(run.streak, 6) * 0.25);
  let timeBonus = 0;
  if (contract.id === 'express' && contract.total > 0) timeBonus = clamp(contract.timeLeft / contract.total, 0, 1);
  const base = 100 + player.cargo * 25 + Math.min(200, contract.dist * 0.15);
  let gain = Math.round(base * mult * (1 + timeBonus) * stats.scoreMul);
  let note = contract.name;
  if (contract.id === 'fragile' && contract.damaged) { gain = Math.round(gain * 0.5); note = 'CARGO COMPROMISED'; }
  run.score += gain;
  run.deliveries++;
  run.streak++;
  sfx.deliver();
  say('DELIVERY COMPLETE  +' + gain, note + '  ·  upgrade available', 3);
  ringMat.color.setHex(0x7fe0c0);
  setTimeout(() => ringMat.color.setHex(0xffb04a), 400);

  // difficulty ramp
  ensureStorms(Math.min(8, 4 + Math.floor(run.deliveries / 2)));
  ensureHounds(Math.min(7, 1 + Math.floor(run.deliveries * 0.8)));
  if (run.deliveries % 5 === 0) {
    run.score += 250;
    say('SECTOR CLEARED', 'Milestone bonus +250', 3);
  }
  offerPerks();
}

// ---------- HUD (canvas 2D, no HTML) ----------
const FONT = '600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function bar(ctx, x, y, w, h, frac, colA, colB, label) {
  ctx.fillStyle = 'rgba(8,12,17,0.62)';
  roundRect(ctx, x, y, w, h, 3);
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, colA); g.addColorStop(1, colB);
  ctx.fillStyle = g;
  roundRect(ctx, x + 1, y + 1, Math.max(0, (w - 2) * clamp(frac, 0, 1)), h - 2, 2);
  if (label) {
    ctx.font = FONT;
    ctx.fillStyle = 'rgba(220,232,240,0.85)';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + 8, y + h / 2 + 0.5);
  }
}

function drawHUD(t) {
  const W = uiCanvas.width / dpr, H = uiCanvas.height / dpr;
  uctx.clearRect(0, 0, W, H);
  uctx.save();

  if (gameState === 'title') {
    uctx.textAlign = 'center'; uctx.textBaseline = 'middle';
    uctx.fillStyle = 'rgba(6,9,13,0.45)'; uctx.fillRect(0, 0, W, H);
    uctx.font = '700 46px ui-monospace, Menlo, monospace';
    uctx.fillStyle = '#f0f4f8';
    uctx.fillText('W A L K E R', W / 2, H / 2 - 56);
    uctx.font = FONT;
    uctx.fillStyle = 'rgba(180,200,215,0.9)';
    uctx.fillText('a delivery roguelike — carry, climb, survive, upgrade', W / 2, H / 2 - 8);
    uctx.fillText('hounds hunt you · storms drain you · every delivery makes you stronger', W / 2, H / 2 + 14);
    uctx.fillStyle = 'rgba(255,176,74,' + (0.55 + Math.sin(t * 3) * 0.35) + ')';
    uctx.fillText('PRESS ENTER TO ACCEPT YOUR FIRST CONTRACT', W / 2, H / 2 + 62);
    uctx.fillStyle = 'rgba(140,160,175,0.75)';
    uctx.fillText('WASD move · SHIFT sprint · SPACE jump · drag to look · wheel zoom', W / 2, H - 52);
    uctx.restore();
    return;
  }

  // --- top left: vitals ---
  bar(uctx, 20, 20, 190, 16, player.hp / 100, '#ff5a4d', '#ff9a5a', 'HULL');
  bar(uctx, 20, 42, 190, 16, player.stamina / stats.maxStamina, '#3aa0ff', '#7fe0ff', 'STAMINA');
  uctx.font = FONT; uctx.textAlign = 'left'; uctx.textBaseline = 'middle';
  uctx.fillStyle = 'rgba(200,215,225,0.8)';
  uctx.fillText('CARGO ' + player.cargo + '/' + stats.maxCargo, 20, 72);

  // --- contract card ---
  if (contract) {
    const y = 88;
    uctx.fillStyle = 'rgba(8,12,17,0.5)';
    roundRect(uctx, 20, y, 250, contract.id === 'express' ? 52 : 38, 4);
    uctx.fillStyle = '#ffb04a';
    uctx.font = '700 11px ui-monospace, Menlo, monospace';
    uctx.textAlign = 'left';
    uctx.fillText(contract.name, 30, y + 16);
    uctx.fillStyle = 'rgba(190,205,218,0.75)';
    uctx.font = '600 11px ui-monospace, Menlo, monospace';
    uctx.fillText(contract.desc, 30, y + 30);
    if (contract.id === 'express') {
      const frac = clamp(contract.timeLeft / contract.total, 0, 1);
      bar(uctx, 30, y + 38, 230, 8, frac, frac < 0.3 ? '#ff4d3d' : '#ffb04a', frac < 0.3 ? '#ff8a5a' : '#ffe08a');
    }
  }

  // --- top right: score ---
  uctx.textAlign = 'right';
  uctx.fillStyle = '#f0f4f8';
  uctx.font = '700 22px ui-monospace, Menlo, monospace';
  uctx.fillText(String(run.score).padStart(5, '0'), W - 20, 32);
  uctx.font = FONT;
  uctx.fillStyle = 'rgba(160,180,195,0.8)';
  uctx.fillText('DELIVERIES ' + run.deliveries, W - 20, 54);
  if (run.streak > 0) {
    uctx.fillStyle = '#7fe0c0';
    uctx.fillText('COMBO x' + (1 + Math.min(run.streak, 6) * 0.25).toFixed(2), W - 20, 72);
  }

  // --- compass to target ---
  const rel = Math.atan2(delivery.x - player.x, delivery.z - player.z);
  const camFwd = Math.atan2(-Math.sin(cam.yaw), -Math.cos(cam.yaw));
  const bearing = rel - camFwd;
  const cx = W / 2, cy = 46, R = 26;
  uctx.save();
  uctx.translate(cx, cy);
  uctx.strokeStyle = 'rgba(120,140,155,0.35)';
  uctx.lineWidth = 1.5;
  uctx.beginPath(); uctx.arc(0, 0, R, 0, TAU); uctx.stroke();
  uctx.rotate(-bearing);
  uctx.fillStyle = '#ffb04a';
  uctx.beginPath();
  uctx.moveTo(0, -R - 4); uctx.lineTo(-6, -R + 8); uctx.lineTo(6, -R + 8);
  uctx.closePath(); uctx.fill();

  // hound bearings on the same ring
  for (const h of hounds) {
    const hd = dist2(h.position.x, h.position.z, player.x, player.z);
    if (hd > 34) continue;
    const hb = Math.atan2(h.position.x - player.x, h.position.z - player.z) - camFwd - bearing;
    uctx.rotate(hb);
    uctx.fillStyle = 'rgba(255,70,60,' + clamp(1 - hd / 34, 0.2, 1) + ')';
    uctx.beginPath(); uctx.arc(0, R, 3, 0, TAU); uctx.fill();
    uctx.rotate(-hb);
  }
  uctx.restore();
  const d = dist2(player.x, player.z, delivery.x, delivery.z);
  uctx.textAlign = 'center';
  uctx.fillStyle = 'rgba(210,222,232,0.85)';
  uctx.font = FONT;
  uctx.fillText(Math.round(d) + ' m', cx, cy + R + 16);

  // --- center message ---
  if (message.t > 0) {
    const a = clamp(message.t, 0, 1);
    uctx.globalAlpha = a;
    uctx.textAlign = 'center';
    uctx.fillStyle = '#ffe6c4';
    uctx.font = '700 20px ui-monospace, Menlo, monospace';
    uctx.fillText(message.text, W / 2, H * 0.34);
    if (message.sub) {
      uctx.fillStyle = 'rgba(190,205,218,0.85)';
      uctx.font = FONT;
      uctx.fillText(message.sub, W / 2, H * 0.34 + 24);
    }
    uctx.globalAlpha = 1;
  }

  // --- atmosphere: vignette + storm tint + danger tint ---
  const vg = uctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  uctx.fillStyle = vg; uctx.fillRect(0, 0, W, H);

  const inStorm = storms.some((s) => dist2(player.x, player.z, s.x, s.z) < s.radius);
  if (inStorm) {
    const a = 0.3 + Math.sin(t * 8) * 0.1;
    const g = uctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.85);
    g.addColorStop(0, 'rgba(90,120,160,0)');
    g.addColorStop(1, 'rgba(90,130,180,' + a + ')');
    uctx.fillStyle = g; uctx.fillRect(0, 0, W, H);
    uctx.textAlign = 'center';
    uctx.fillStyle = 'rgba(200,225,255,' + (0.6 + Math.sin(t * 8) * 0.3) + ')';
    uctx.font = '700 16px ui-monospace, Menlo, monospace';
    uctx.fillText('STORM — GET OUT OF IT', W / 2, 100);
  }

  let nearest = 1e9;
  for (const h of hounds) nearest = Math.min(nearest, dist2(h.position.x, h.position.z, player.x, player.z));
  if (nearest < 18) {
    const a = clamp(1 - nearest / 18, 0, 1) * (0.5 + Math.sin(t * 10) * 0.25);
    const g = uctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
    g.addColorStop(0, 'rgba(160,20,20,0)');
    g.addColorStop(1, 'rgba(190,30,25,' + a * 0.5 + ')');
    uctx.fillStyle = g; uctx.fillRect(0, 0, W, H);
  }

  // --- low stamina / hurt flash ---
  if (player.stamina < 12) {
    uctx.textAlign = 'center';
    uctx.fillStyle = 'rgba(255,190,120,' + (0.5 + Math.sin(t * 9) * 0.3) + ')';
    uctx.font = FONT;
    uctx.fillText('EXHAUSTED — REST TO RECOVER', W / 2, H - 92);
  }
  if (player.hurtCd > 0) {
    uctx.fillStyle = 'rgba(255,40,30,' + (player.hurtCd * 0.5) + ')';
    uctx.fillRect(0, 0, W, H);
  }

  // --- controls hint (first 12s of a run) ---
  if (run.time < 12) {
    uctx.globalAlpha = clamp(12 - run.time, 0, 1) * 0.7;
    uctx.textAlign = 'left';
    uctx.fillStyle = 'rgba(170,190,205,0.9)';
    uctx.font = FONT;
    uctx.fillText('WASD move · SHIFT sprint · SPACE jump · drag look · wheel zoom · T telemetry', 20, H - 24);
    uctx.globalAlpha = 1;
  }

  // --- perk picker ---
  if (gameState === 'perk') {
    uctx.fillStyle = 'rgba(6,9,13,0.78)'; uctx.fillRect(0, 0, W, H);
    uctx.textAlign = 'center';
    uctx.fillStyle = '#f0f4f8';
    uctx.font = '700 26px ui-monospace, Menlo, monospace';
    uctx.fillText('DELIVERY LOGGED — CHOOSE AN UPGRADE', W / 2, H / 2 - 130);
    perkOffers.forEach((o, i) => {
      const cw = 300, ch = 84, gap = 18;
      const x = W / 2 - cw / 2, y = H / 2 - 90 + i * (ch + gap);
      uctx.fillStyle = 'rgba(18,26,34,0.95)';
      roundRect(uctx, x, y, cw, ch, 8);
      uctx.strokeStyle = 'rgba(255,176,74,0.5)'; uctx.lineWidth = 1.5;
      uctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
      uctx.textAlign = 'left';
      uctx.fillStyle = '#ffb04a';
      uctx.font = '700 15px ui-monospace, Menlo, monospace';
      uctx.fillText('[' + (i + 1) + ']  ' + o.name, x + 20, y + 32);
      uctx.fillStyle = 'rgba(200,214,226,0.85)';
      uctx.font = FONT;
      uctx.fillText(o.desc, x + 20, y + 56);
    });
  }

  // --- death screen ---
  if (gameState === 'dead') {
    uctx.fillStyle = 'rgba(10,6,6,0.8)'; uctx.fillRect(0, 0, W, H);
    uctx.textAlign = 'center';
    uctx.fillStyle = '#ff8a72';
    uctx.font = '700 34px ui-monospace, Menlo, monospace';
    uctx.fillText('SIGNAL LOST', W / 2, H / 2 - 70);
    uctx.fillStyle = '#f0f4f8';
    uctx.font = FONT;
    uctx.fillText('deliveries ' + run.deliveries + '   ·   score ' + run.score + '   ·   ' + Math.round(run.time) + 's', W / 2, H / 2 - 24);
    uctx.fillStyle = 'rgba(160,180,195,0.7)';
    uctx.fillText('best this session ' + run.best, W / 2, H / 2 + 2);
    uctx.fillStyle = 'rgba(255,176,74,' + (0.55 + Math.sin(t * 3) * 0.35) + ')';
    uctx.fillText('PRESS ENTER TO WALK AGAIN', W / 2, H / 2 + 52);
  }

  uctx.restore();
}

// ---------- resize ----------
let dpr = 1;
function resize() {
  const w = innerWidth, h = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  uiCanvas.width = Math.floor(w * dpr);
  uiCanvas.height = Math.floor(h * dpr);
  uctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- main loop ----------
updateChunks(0, 0);
ensureStorms(4);
placeDelivery();
let prev = performance.now();
let elapsed = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  elapsed += dt;

  if (gameState === 'play') {
    run.time += dt;
    const inStorm = updatePlayer(dt);
    poseWalker(elapsed, inStorm);
    walker.position.set(player.x, player.y, player.z);
    walker.rotation.y = player.yaw;
    updateWorld(dt, elapsed);
    if (message.t > 0) message.t -= dt;
  } else if (gameState === 'title' || gameState === 'dead') {
    poseWalker(elapsed, false);
    walker.position.set(player.x, player.y, player.z);
    walker.rotation.y = player.yaw;
    updateWorld(dt, elapsed);
  } else if (gameState === 'perk') {
    poseWalker(elapsed, false);
    updateDust(dt);
  }

  updateCamera(dt);
  renderer.render(scene, camera);
  drawHUD(elapsed);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// debug/telemetry handle for automated testing and motion-capture export
if (location.search.includes('debug')) {
  window.__walker = {
    player, run, stats, delivery, storms, hounds, telemetry,
    get state() { return gameState; },
    get contract() { return contract; },
    get perkOffers() { return perkOffers.map((o) => o.name); },
    get chunks() { return chunks.size; },
    get salvage() { return salvageList.length; },
    damage(n) { damage(n, 'debug'); },
    teleport(x, z) { player.x = x; player.z = z; player.y = WALK(x, z); },
    goToDelivery() { player.x = delivery.x; player.z = delivery.z; player.y = WALK(delivery.x, delivery.z); },
  };
}
